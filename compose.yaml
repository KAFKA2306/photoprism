services:
  photoprism:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORKING_DIR: "${WORKING_DIR:-/go/src/github.com/photoprism/photoprism}"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${PHOTOPRISM_BIND_HOST:-127.0.0.1}:2342:2342"
    env_file:
      - path: .env
        required: false
    environment:
      PHOTOPRISM_UID: "${UID:-1000}"
      PHOTOPRISM_GID: "${GID:-1000}"
      PHOTOPRISM_ADMIN_USER: "${PHOTOPRISM_ADMIN_USER:-admin}"
      PHOTOPRISM_ADMIN_PASSWORD: "${PHOTOPRISM_ADMIN_PASSWORD:?set PHOTOPRISM_ADMIN_PASSWORD in .env}"
      PHOTOPRISM_AUTH_MODE: "password"
      PHOTOPRISM_USAGE_INFO: "false"
      PHOTOPRISM_DEFAULT_LOCALE: "ja"
      PHOTOPRISM_PLACES_LOCALE: "local"
      PHOTOPRISM_SITE_URL: "${PHOTOPRISM_SITE_URL:-http://localhost:2342/}"
      PHOTOPRISM_SITE_NAME: "${PHOTOPRISM_SITE_NAME:-Photo Memories}"
      PHOTOPRISM_DATABASE_DRIVER: "mysql"
      PHOTOPRISM_DATABASE_SERVER: "mariadb:3306"
      PHOTOPRISM_DATABASE_NAME: "photoprism"
      PHOTOPRISM_DATABASE_USER: "photoprism"
      PHOTOPRISM_DATABASE_PASSWORD: "${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}"
      PHOTOPRISM_ORIGINALS_PATH: "/photoprism/originals"
      PHOTOPRISM_STORAGE_PATH: "/photoprism/storage"
      PHOTOPRISM_IMPORT_PATH: "/photoprism/import"
      PHOTOPRISM_DISABLE_OIDC: "true"
      PHOTOPRISM_DISABLE_WEBDAV: "true"
      PHOTOPRISM_DISABLE_PLACES: "false"
      PHOTOPRISM_DISABLE_TENSORFLOW: "false"
      PHOTOPRISM_XMP_FACES: "true"
      PHOTOPRISM_FFMPEG_ENCODER: "nvidia"
      PHOTOPRISM_INIT: "tensorflow-gpu"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      WORKING_DIR: "${WORKING_DIR:-/go/src/github.com/photoprism/photoprism}"
    working_dir: "${WORKING_DIR:-/go/src/github.com/photoprism/photoprism}"
    volumes:
      - ".:${WORKING_DIR:-/go/src/github.com/photoprism/photoprism}"
      - "./storage:/photoprism"
      - "go-mod:/go/pkg/mod"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1
    restart: unless-stopped

  mariadb:
    image: mariadb:12.3
    stop_grace_period: 15s
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command:
      - --innodb-strict-mode=1
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=512
      - --innodb-rollback-on-timeout=OFF
      - --innodb-lock-wait-timeout=120
    volumes:
      - "./storage/database:/var/lib/mysql"
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"
      MARIADB_DATABASE: "photoprism"
      MARIADB_USER: "photoprism"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  go-mod:
