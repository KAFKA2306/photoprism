name: One-shot frontend cleanup

on:
  push:
    branches:
      - feat/personal-memory-journal-v2

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Apply cleanup
        run: python tools/one_shot_remove_commercial_frontend.py
      - name: Audit residue
        run: |
          set -euo pipefail
          if grep -R -nE --exclude-dir=locales 'isSponsor|getMembership|getCustomer|getTier|PDialogSponsor|PConfirmSponsor|IconSponsor|\$sponsorFeatures|name: "upgrade"|/upgrade|membership@photoprism|PhotoPrism\+ Membership|action-membership' frontend/src; then
            exit 1
          fi
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-frontend-cleanup.yml tools/one_shot_remove_commercial_frontend.py
          git add frontend/src
          git commit -m 'refactor: remove commercial membership frontend'
          git push
      - name: Remove temporary files on failure
        if: failure()
        run: |
          git reset --hard HEAD
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/one-shot-frontend-cleanup.yml tools/one_shot_remove_commercial_frontend.py
          git commit -m 'chore: remove failed frontend cleanup helpers'
          git push
