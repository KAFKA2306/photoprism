name: One-shot decouple commercial gates

on:
  push:
    branches:
      - feat/personal-memory-journal-v2

permissions:
  contents: write

jobs:
  decouple:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Recover reviewed migration script
        run: git show HEAD~2:.github/scripts/decouple_commercial_gates.py > /tmp/decouple_commercial_gates.py

      - name: Apply capability migration
        run: python3 /tmp/decouple_commercial_gates.py

      - name: Format Go changes
        run: gofmt -w internal/config/config_features.go internal/config/config_features_test.go internal/commands/places.go

      - name: Verify runtime source audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE --exclude-dir=locales '\$sponsorFeatures|PConfirmSponsor|IconSponsor|component/(confirm|icon)/sponsor\.vue' frontend/src; then exit 1; fi
          grep -n 'requiresMapKey' frontend/src/options/options.js
          if grep -n 'DisableVectors || !c.Sponsor' internal/config/config_features.go; then exit 1; fi
          if grep -n 'force && !conf.Sponsor' internal/commands/places.go; then exit 1; fi

      - name: Run Go tests
        run: go test ./internal/config ./internal/commands

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A frontend/src internal/config internal/commands
          git commit -m 'refactor: decouple local features from membership gates'
          git push

      - name: Self-delete workflow
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-decouple-commercial-gates.yml
          git commit -m 'chore: remove one-shot commercial gate workflow'
          git push
