name: One-shot remove backend membership

on:
  push:
    branches:
      - feat/personal-memory-journal-v2

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Remove commercial membership state while preserving geodata credentials
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found: {path}")
              p.write_text(text.replace(old, new))

          replace(
              "internal/config/config_features.go",
              '// Sponsor indicates whether sponsor or demo features are enabled.\nvar Sponsor = Env(EnvDemo, EnvSponsor, EnvTest)\n\n',
              '',
          )
          replace(
              "internal/config/config.go",
              '\t// Show support information.\n\tif !c.Sponsor() {\n\t\tlog.Info(MsgSponsor)\n\t\tlog.Info(MsgSignUp)\n\t}\n\n',
              '',
          )
          replace(
              "internal/config/config.go",
              '// Sponsor reports if you have chosen to support our mission.\nfunc (c *Config) Sponsor() bool {\n\tif Sponsor || c.options.Sponsor {\n\t\treturn true\n\t} else if c.hub != nil {\n\t\tSponsor = c.Hub().Sponsor()\n\t}\n\n\treturn Sponsor\n}\n\n',
              '',
          )
          replace(
              "internal/config/config.go",
              '\tif token := os.Getenv(EnvVar("CONNECT")); token != "" && !c.Hub().Sponsor() {\n\t\t_ = c.RenewApiKeysWithToken(token)\n\t} else {\n\t\t_ = c.RenewApiKeysWithToken("")\n\t}\n',
              '\tif token := os.Getenv(EnvVar("CONNECT")); token != "" {\n\t\t_ = c.RenewApiKeysWithToken(token)\n\t} else {\n\t\t_ = c.RenewApiKeysWithToken("")\n\t}\n',
          )
          replace(
              "internal/service/hub/config.go",
              '// Tier returns the numeric membership tier from the decoded session; zero indicates none.\nfunc (c *Config) Tier() int {\n\tif sess, err := c.DecodeSession(true); err != nil {\n\t\treturn 0\n\t} else {\n\t\treturn sess.Tier\n\t}\n}\n\n// Membership returns the membership level as string.\nfunc (c *Config) Membership() string {\n\tif !c.Sponsor() {\n\t\treturn string(StatusCommunity)\n\t}\n\n\treturn string(c.Status)\n}\n\n// Customer returns the customer name.\nfunc (c *Config) Customer() string {\n\tif sess, err := c.DecodeSession(true); err != nil {\n\t\treturn ""\n\t} else {\n\t\treturn sess.Customer\n\t}\n}\n\n',
              '',
          )
          replace(
              "internal/service/hub/config.go",
              '// Sponsor reports if you support the project.\nfunc (c *Config) Sponsor() bool {\n\tswitch c.Status {\n\tcase StatusUnknown, StatusNew, StatusCommunity:\n\t\treturn false\n\t}\n\n\treturn len(c.Session) > 0 && len(c.MapKey()) > 0\n}\n\n',
              '',
          )
          replace(
              "internal/service/hub/session.go",
              '\tTier      int\n\tMapKey    string\n\tCustomer  string `json:",omitempty"`\n\tExpiresAt string\n',
              '\tMapKey    string\n\tExpiresAt string\n',
          )
          replace(
              "internal/service/hub/config_test.go",
              '\nfunc TestConfig_Sponsor(t *testing.T) {\n\tt.Run("Status", func(t *testing.T) {\n\t\tc := NewConfig("test", "testdata/new.yml", "zr58wrg19i8jfjam", "test", "PhotoPrism/Test", "test")\n\t\tc.Key = "0e159b773c6fb779c3bf6c8ba6e322abf559dbaf"\n\t\tc.Secret = "23f0024975bd65ade06edcc8191f7fcc"\n\t\tassert.False(t, c.Sponsor())\n\t\tc.Status = "sponsor"\n\t\tassert.False(t, c.Sponsor())\n\t\tc.Session = "bde6d0cf514e5456591de5ae09d981056eb88dccf71ba268974bf2cc7b028545e7641c1dfbaa716e4d13f8b0e0d1863e64c16e1f0ac551fc85e1171a87cbda6608cbe330de9e0d5f5b0e14ff61f2ff08fee369"\n\t\tassert.True(t, c.Sponsor())\n\t\tc.Status = ""\n\t\tassert.False(t, c.Sponsor())\n\t\tc.Session = ""\n\t})\n}\n',
              '\n',
          )

      - name: Format Go
        run: gofmt -w internal/config/config.go internal/config/config_features.go internal/service/hub/config.go internal/service/hub/session.go internal/service/hub/config_test.go

      - name: Verify membership symbols removed from backend runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE --exclude='*_test.go' 'Sponsor\(|\.Membership\(|\.Customer\(|\.Tier\(|sess\.(Tier|Customer)' internal/config internal/service/hub internal/commands; then
            exit 1
          fi

      - name: Run focused Go tests
        run: go test ./internal/config ./internal/service/hub ./internal/commands

      - name: Commit validated migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/config internal/service/hub internal/commands
          git commit -m 'refactor: remove backend commercial membership state'
          git push

      - name: Self-delete workflow
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-remove-backend-membership.yml
          git commit -m 'chore: remove backend membership migration workflow'
          git push
