name: 個人用月次日記

on:
  push:
    paths:
      - "personal/journal/**"
      - ".github/workflows/personal-journal.yml"
  pull_request:
    paths:
      - "personal/journal/**"
      - ".github/workflows/personal-journal.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
      - name: Pythonを設定
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 月次日記のテスト
        run: python -m unittest discover -s personal/journal/tests -v
