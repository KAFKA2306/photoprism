name: One-shot remove commercial frontend

on:
  push:
    branches:
      - feat/personal-memory-journal-v2

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Remove commercial frontend gates and UI
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path); text = p.read_text()
              if old not in text: raise SystemExit(f"expected block not found: {path}")
              p.write_text(text.replace(old, new))

          def regex_replace(path, pattern, new, count=1):
              p = Path(path); text = p.read_text()
              out, n = re.subn(pattern, new, text, count=count, flags=re.S)
              if n != count: raise SystemExit(f"expected {count} regex match in {path}, got {n}")
              p.write_text(out)

          replace("frontend/src/common/config.js", '''  isSponsor() {
            if (!this.values || !this.values.sponsor) {
              return false;
            }

            return !this.values.demo && !this.values.test;
          }

'''.replace('            ', ''), '')
          regex_replace("frontend/src/common/config.js", r'''  getTier\(\) \{.*?\n  \}\n\n  getMembership\(\) \{.*?\n  \}\n\n  getCustomer\(\) \{.*?\n  \}\n\n''', '')

          replace("frontend/src/page/settings/advanced.vue", '<v-col v-if="isSponsor" cols="12" sm="6" lg="4">', '<v-col cols="12" sm="6" lg="4">')
          replace("frontend/src/page/settings/advanced.vue", '      isSponsor: this.$config.isSponsor(),\n', '')
          replace("frontend/src/page/auth/login.vue", '      sponsor: this.$config.isSponsor(),\n', '')

          replace("frontend/src/page/settings/general.vue", '    <p-confirm-sponsor :visible="dialog.sponsor" @close="dialog.sponsor = false"></p-confirm-sponsor>\n', '')
          replace("frontend/src/page/settings/general.vue", 'import PConfirmSponsor from "component/confirm/sponsor.vue";\n', '')
          replace("frontend/src/page/settings/general.vue", '    PConfirmSponsor,\n', '')
          replace("frontend/src/page/settings/general.vue", '      dialog: {\n        sponsor: false,\n      },\n', '')
          regex_replace("frontend/src/page/settings/general.vue", r'''    onChangeMapsStyle\(value\) \{.*?\n    \},\n    onChange\(\) \{''', '''    onChangeMapsStyle(value) {
      if (!value) {
        this.currentMapsStyle = value;
        this.onChange();
        return;
      }

      const style = this.mapsStyle.find((s) => s.value === value);
      if (!style) {
        return false;
      }

      this.currentMapsStyle = value;
      this.onChange();
    },
    onChange() {''')

          replace("frontend/src/component/components.js", 'import IconSponsor from "component/icon/sponsor.vue";\n', '')
          replace("frontend/src/component/components.js", 'import PConfirmSponsor from "component/confirm/sponsor.vue";\n', '')
          replace("frontend/src/component/components.js", '  app.component("IconSponsor", IconSponsor);\n', '')
          replace("frontend/src/component/components.js", '  app.component("PConfirmSponsor", PConfirmSponsor);\n', '')

          replace("frontend/src/component/icons.js", 'import IconSponsor from "./icon/sponsor.vue";\n', '')
          regex_replace("frontend/src/component/icons.js", r'''  sponsor: \{\n    component: IconSponsor,\n    props: \{\n      name: "sponsor",\n    \},\n  \},\n''', '')

          replace("frontend/src/page/about/about.vue", '<span class="text-ltr">{{ $config.getAbout() }}{{ getMembership() }}</span>', '<span class="text-ltr">{{ $config.getAbout() }}</span>')
          regex_replace("frontend/src/page/about/about.vue", r'''\n      <template v-if="canUpgrade">.*?\n      </template>\n      <template v-else-if="isSuperAdmin">.*?\n      </template>\n''', '\n')
          regex_replace("frontend/src/page/about/about.vue", r'''  data\(\) \{\n    const tier = this\.\$config\.getTier\(\);.*?\n  \},\n  mounted\(\) \{''', '''  data() {
    return {
      links,
      rtl: this.$isRtl,
    };
  },
  mounted() {''')
          regex_replace("frontend/src/page/about/about.vue", r'''  methods: \{\n    getMembership\(\) \{.*?\n    \},\n  \},\n''', '')

          Path("frontend/src/component/confirm/sponsor.vue").unlink()
          Path("frontend/src/component/icon/sponsor.vue").unlink()

      - name: Audit commercial frontend residue
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE --exclude-dir=locales 'isSponsor|getMembership|getCustomer|getTier|PDialogSponsor|PConfirmSponsor|IconSponsor|\$sponsorFeatures|name: "upgrade"|/upgrade|membership@photoprism|PhotoPrism\+ Membership|action-membership' frontend/src; then
            exit 1
          fi
          git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit validated frontend cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-remove-commercial-frontend.yml
          git add frontend/src
          git commit -m 'refactor: remove commercial membership frontend'
          git push

      - name: Self-delete failed workflow
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-remove-commercial-frontend.yml
          git commit -m 'chore: remove failed frontend migration workflow'
          git push
